defaults:
  - base@dataset
  - _self_

probability: 1.0

dataset:
  name: mgnify_small_june_2025
  data: ${paths.data.df_dir}/mgnify/mgnify_small_june_2025.parquet
  filters:
    # We use filters of ptm > 0.7 for old-RF3 distillation and ptm > 0.75 for new-RF3 distillation
    - "ptm > 0.7"
  columns_to_load:
    - example_id
    - path
    - ptm
  # TODO: Rewrite to use relative paths in the dataframe and supply base_path to loader here

  transform:
    protein_msa_dirs:
      - dir: ${paths.data.squash_dir}/mgnify_distill_rf3/msas
        extension: .a3m.gz
        directory_depth: 2
    rna_msa_dirs: []
    # mgnify b-factor ranges 0-1 not 0-100
    b_factor_min: 0.7
