#       rasa_kwargs:
#         p_add_rasa_condition: 0.6
#       hbond_kwargs:
#         p_add_hbond_condition: 0.0

ppi_hotspot:
  frequency: 15.0
  transform:
    _target_: rf3.data.design_tasks.ppi.PPIHotspot
    max_hotspots_frac_to_provide: 0.1
    hotspot_max_distance: 4.5
    # Writes C_ITYPE (PPI / PLI / PNA) on the sampled hotspot atoms only, so interface
    # type has exactly this task's frequency and never occurs without hotspots.
    annotate_interface_type: true
    # INERT: kept so this file still matches the recipe the released weights were trained
    # with, but PPIHotspot.forward never calls `apply_design_task_modifiers`, the only
    # reader of rasa_kwargs / hbond_kwargs. These two probabilities have no effect here --
    # do not count them when computing RASA / hbond training frequencies.
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.0


# ---------------------------------------------------------------------------
# C_DIS tasks: the 2D atom-pair-distance condition, enabled at 1.0 each (4 % total).
# rasa_kwargs / hbond_kwargs below are live -- these tasks do call
# `apply_design_task_modifiers`.
# ---------------------------------------------------------------------------
tip_atom_partial_ligand_distance:
  frequency: 1.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.TipAtomPartialLigandDistanceTask
    n_max_ligands: 3
    n_hops_expected_ligand: 5
    n_min_residues: 2
    n_max_residues: 14
    n_hops_expected_tip_atom: 3
    p_seq_conditioned: 0.5
    p_knockout_seq: 0.3
    p_knockout_dist: 0.5
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.3
    lig_lig_potential_cutoff: 10.0
    max_dist_cutoff: 10.0
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.0

tip_atom_distance:
  frequency: 1.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.TipAtomDistanceTask
    n_min_residues: 2
    n_max_residues: 14
    p_tip_atom: 0.5
    n_hops_expected: 3
    p_seq_conditioned: 0.5
    p_knockout_seq: 0.9
    p_knockout_dist: 0.9
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.3
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.0

partial_ligand_distance:
  frequency: 1.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.PartialLigandDistanceTask
    min_coverage_fraction: 0.0
    max_coverage_fraction: 1.0
    p_knockout_dist: 0.8
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.3
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.2

motif_scaffold_distance:
  frequency: 1.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.MotifScaffoldDistanceTask
    min_tokens_per_motif: 1
    max_tokens_per_motif: 50
    min_coverage_fraction: 0.05
    max_coverage_fraction: 1.0
    inter_motif_distance_p: 0.2
    p_knockout_dist: 0.8
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.9
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.2

