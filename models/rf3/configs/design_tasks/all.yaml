# All available design tasks with default frequencies.
# Datasets can inherit this and override individual task frequencies as needed.
#
# `frequency` is a relative sampling weight; the enabled tasks below sum to 100, so each
# weight also reads directly as a percentage of training examples.
#
# The four 2D atom-pair-distance tasks (C_DIS / `condition_distance_2_atom`) are ENABLED,
# at frequency 1.0 each. They are what trains the condition exposed at inference time as
# `distance_template_selection`. Effective per-example condition rates under this file:
#
#   hotspot        (C_HOT)   15 %    ppi_hotspot
#   interface type (C_ITYPE) 15 %    ppi_hotspot, via annotate_interface_type: true
#   atom-pair dist (C_DIS)    4 %    the four tasks below, 1.0 each
#   RASA           (C_RAS)    2.4 %  0.6 x 4 %, from the distance tasks' rasa_kwargs
#   hbond          (C_HB)     0.4 %  (0.0 + 0.0 + 0.2 + 0.2) x 1 %, their hbond_kwargs
#
# RASA and hbond count only the distance tasks because `apply_design_task_modifiers` --
# the only reader of rasa_kwargs / hbond_kwargs -- is called exclusively from
# rf3/data/design_tasks/motif_scaffolding.py; see the note on ppi_hotspot below.

unconditional:
  frequency: 81.0
  transform:
    _target_: rf3.data.design_tasks.base.UnconditionalTask

# tip_atom_active_site:
