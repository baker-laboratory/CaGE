
unconditional:
  frequency: 96.0
  transform:
    _target_: rf3.data.design_tasks.base.UnconditionalTask

tip_atom_distance:
  frequency: 2.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.TipAtomDistanceTask
    n_min_residues: 2
    n_max_residues: 14
    p_tip_atom: 0.5
    n_hops_expected: 3
    p_seq_conditioned: 0.5
    p_knockout_seq: 0.9
    p_knockout_dist: 0.9
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.3
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.0
  
motif_scaffold_distance:
  frequency: 2.0
  transform:
    _target_: rf3.data.design_tasks.motif_scaffolding.MotifScaffoldDistanceTask
    min_tokens_per_motif: 1
    max_tokens_per_motif: 50
    min_coverage_fraction: 0.05
    max_coverage_fraction: 1.0
    inter_motif_distance_p: 0.2
    p_knockout_dist: 0.8
    knockout_dist_min_fraction: 0.1
    knockout_dist_max_fraction: 0.9
    global_design_task_kwargs:
      rasa_kwargs:
        p_add_rasa_condition: 0.6
      hbond_kwargs:
        p_add_hbond_condition: 0.2

