defaults:
  - rf3_net

# Model architecture
_target_: rf3.model.RF3.RF3WithConfidence

# Default off; experiments that must line up with a released CaGE checkpoint's
# masked-token head override with ``n_classes: 21`` so trunk weights copy cleanly.
masked_token_recovery_head: null

# +---------- Mini rollout sampler ----------+
# From the AF-3 main text:
# > ... To remedy this, we developed a diffusion ‘rollout’ procedure for the full-structure prediction generation during training (using a larger step size than normal)
# They do not further elaborate on how they adjusted the step size during diffusion rollout, but this may be a fruitful area of exploration moving forwards
mini_rollout_sampler:
  solver: "af3"
  num_timesteps: 20 # 20 timesteps for the mini-rollout (vs. 200 for the full rollout during inference)
  min_t: 0
  max_t: 1
  sigma_data: ${model.net.diffusion_module.sigma_data}
  s_min: 4e-4
  s_max: 160
  p: 7
  gamma_0: 0.8
  gamma_min: 1.0
  noise_scale: 1.003
  step_scale: 1.5

# +---------- Confidence head architecture ----------+
# Pairformer kwargs must match PairformerBlock / AttentionPairBias signatures
# (compile, qk_norm, use_cuequivariance). Same cueq flags as the structure trunk
# so is_padding_I masking behavior is identical.
confidence_head:
  c_s: ${model.net.c_s}
  c_z: ${model.net.c_z}
  n_pairformer_layers: 4
  pairformer:
    p_drop: 0.25
    compile: ${model.compile}
    triangle_multiplication:
      d_hidden: 128
      use_cuequivariance: ${model.use_cueq_trimult}
    triangle_attention:
      n_head: 4
      d_hidden: 32
      use_cuequivariance: ${model.use_cueq_triattn}
    attention_pair_bias:
      n_head: 16
      qk_norm: true
      use_cuequivariance: ${model.use_cueq_attnbias}
  n_bins_pae: 64
  n_bins_pde: 64
  n_bins_plddt: 50
  n_bins_exp_resolved: 2
  # Reinit used when bootstrapping from a checkpoint with no confidence_head
  # weights (see ConfidenceHead.reset_parameters). False (default) preserves
  # the Pairformer's zero-init-before-residual / gate-open scheme; set True
  # only to bit-for-bit reproduce a prior run that used the old blanket
  # Xavier-everywhere reinit.
  legacy_full_reinit: false
